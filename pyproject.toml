[project]
name = "fpl-analyst"
version = "0.1.0"
description = "AI FPL analyst — Layer 1: data pipeline (FPL client + schema + sync job)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.9",
    "langgraph>=0.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
fpl = "fpl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fpl*", "engine*", "graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
